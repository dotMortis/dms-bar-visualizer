[package]
name = "visualizer-core"
version = "0.1.0"
edition = "2021"
description = "The per-frame logic of the Bar Visualizer and the Lock Ring (ADR 0007)"
publish = false

[lib]
name = "visualizer_core"
# rlib for the tests, staticlib and cdylib for C (include/visualizer_core.h), cdylib for WASM.
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
serde_json = "1"
